name: bench

# Triggered by:
#   - push to this repo's `main` (harness edits land → re-bench the latest
#     published arrowspace so the recorded history reflects both halves).
#   - repository_dispatch from arrowspace-rs
#     (event_type: arrowspace-release-published), fired when a release is
#     published.
#   - nightly schedule, so a baseline against the latest published arrowspace
#     is recorded even when neither repo has recent activity.
#   - workflow_dispatch (manual rerun).
#
# One matrix leg per compared arrowspace version: `latest` resolves whatever
# crates.io serves (currently 0.27.x); the other legs pin exact versions via
# `cargo update --precise`. Each leg charts its own gh-pages directory;
# the `compare` job then renders a side-by-side table at gh-pages root.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [arrowspace-release-published]
  schedule:
    # 07:00 UTC daily
    - cron: "0 7 * * *"
  workflow_dispatch:

# Cancel superseded runs to conserve runner minutes.
concurrency:
  group: bench-${{ github.event_name }}-${{ github.event.client_payload.sha || github.ref || github.run_id }}
  cancel-in-progress: true

# benchmark-action auto-pushes trend history to gh-pages, the snapshot step
# commits benches-results/ to main, and the compare job publishes the
# comparison page; all need contents:write.
permissions:
  contents: write

jobs:
  criterion:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - pin: ""
            chart-dir: dev
            label: latest
          - pin: 0.27.0
            chart-dir: dev-v0.27.0
            label: v0.27.0
          - pin: 0.26.14
            chart-dir: dev-v0.26.14
            label: v0.26.14
          - pin: 0.26.12
            chart-dir: dev-v0.26.12
            label: v0.26.12
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache key carries the pin so legs never share a target/ built
      # against a different arrowspace.
      - name: Cache .cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ./target
          key: bench-criterion-${{ matrix.version.label }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: bench-criterion-${{ matrix.version.label }}-

      # Compile first so a compile failure fails the job without spending
      # runner minutes on actually running benches.
      - name: Build benches (no-run)
        run: |
          cargo generate-lockfile
          if [ -n "${{ matrix.version.pin }}" ]; then
            cargo update -p arrowspace --precise ${{ matrix.version.pin }}
          fi
          cargo bench --no-run

      # Run criterion benches. `--output-format bencher` emits one line per
      # bench in the format benchmark-action/github-action-benchmark expects
      # for tool=cargo. pipefail makes a bench failure fail the step instead
      # of hiding behind tee's exit code.
      - name: Run criterion benchmarks
        run: |
          set -o pipefail
          mkdir -p bench-output
          cargo bench \
            --bench build --bench search --bench spectral --bench scale --bench cve \
            -- --output-format bencher | tee bench-output/criterion.json

      # Persist this leg's results to its own gh-pages subdirectory and
      # generate the trend page. auto-push: true lets the action commit the
      # JSON directly. Parallel legs can race on the gh-pages ref; the
      # action re-fetches and retries, and a lost point is advisory-only.
      - name: Store + chart benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: bench-output/criterion.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: ${{ matrix.version.chart-dir }}
          comment-on-alert: true
          # Criterion wall-clock numbers are noisy on GitHub-hosted runners
          # (20-60% variance is normal), so this job is advisory, not a gate.
          fail-on-alert: false
          alert-threshold: "200%"

      - name: Upload criterion.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: criterion-json-${{ matrix.version.label }}
          path: bench-output/criterion.json

      # Resolve the exact arrowspace version cargo picked (read from the
      # Cargo.lock the build step generated). Used as the per-version
      # storage directory name below.
      - name: Resolve arrowspace version
        id: arsver
        run: |
          ver=$(grep -A1 '^name = "arrowspace"$' Cargo.lock | grep version | sed -E 's/version = "([^"]+)".*/\1/')
          if [ -z "$ver" ]; then
            echo "::error::could not resolve arrowspace version from Cargo.lock" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved arrowspace v$ver"

      # Persist this run's criterion.json under benches-results/v<version>/.
      # Idempotent: if that version's results are already in the repo, skip.
      # continue-on-error so a storage hiccup (non-ff push, race with a
      # concurrent run) does not fail the job or block the status check below.
      - name: Store criterion results to benches-results/v<arrowspace>/
        id: store
        continue-on-error: true
        env:
          ARROWSPACE_VER: ${{ steps.arsver.outputs.version }}
        run: |
          set -e
          dir="benches-results/v${ARROWSPACE_VER}"
          # checkout@v4 leaves us detached at the trigger SHA; re-sync to
          # origin/main so a concurrent run's storage commit is visible and
          # our idempotent guard sees it.
          git fetch origin main
          git checkout -B main origin/main
          if [ -f "$dir/criterion.json" ]; then
            echo "::notice::criterion results for v${ARROWSPACE_VER} already stored — skipping"
            exit 0
          fi
          mkdir -p "$dir"
          cp bench-output/criterion.json "$dir/criterion.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dir/criterion.json"
          git commit -m "bench(criterion): record v${ARROWSPACE_VER} results [skip ci]"
          # Retry once on non-ff rejection (concurrent run pushed between
          # our fetch and push); re-sync + re-check idempotency first.
          for attempt in 1 2; do
            if git push origin main; then
              echo "::notice::Stored criterion results to $dir/"
              exit 0
            fi
            echo "push attempt $attempt failed; re-syncing..."
            git fetch origin main
            git checkout -B main origin/main
            if [ -f "$dir/criterion.json" ]; then
              echo "::notice::criterion results for v${ARROWSPACE_VER} were stored by a concurrent run — skipping"
              exit 0
            fi
            cp bench-output/criterion.json "$dir/criterion.json"
            git add "$dir/criterion.json"
            git commit -m "bench(criterion): record v${ARROWSPACE_VER} results [skip ci]"
          done
          echo "::warning::Failed to push criterion storage after 2 attempts; next run will retry" >&2
          exit 1

      # Post a status check back to the arrowspace-rs commit that triggered
      # the run. Only the latest-version leg posts, so a dispatch produces
      # exactly one status check.
      - name: Post status check back to arrowspace-rs
        if: matrix.version.pin == '' && github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BENCHES_STATUS_PAT }}
          script: |
            const sha = context.payload.client_payload.sha;
            if (!sha) {
              core.warning('no client_payload.sha — skipping status check');
              return;
            }
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: 'tuned-org-uk',
              repo: 'arrowspace-rs',
              sha,
              state: 'success',
              context: 'arrowspace-benches / criterion',
              description: 'Criterion bench run completed (advisory)',
              target_url: runUrl,
            });

  # Deterministic instruction-count gate. Linux-only (Valgrind). Counts retired
  # instructions, which are machine-independent, so a tight alert threshold is
  # safe even on GitHub-hosted runners. This is the job that can fail a merge.
  # Runs against the latest published arrowspace (no matrix pinning): the gate
  # guards the current release, which is what the nightly + release-dispatch
  # runs measure. The iai benches mirror the build/search/spectral hot paths at
  # the small end of the criterion grid (Valgrind is ~50x slower than native).
  iai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Cache .cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ./target
          key: bench-iai-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: bench-iai-

      # Compile first so Cargo.lock exists (it's gitignored — not committed),
      # and a compile failure fails the job without spending runner minutes
      # on installing the runner or running Valgrind. The runner binary is
      # only needed at run time, not to build the bench crate.
      - name: Build iai benches (no-run)
        run: cargo bench --no-run --bench iai_build --bench iai_search --bench iai_spectral

      # iai-callgrind 0.14 splits the runtime into a separate
      # `iai-callgrind-runner` binary that `cargo bench` does NOT install.
      # Without it the bench binary fails with "No such file or directory
      # (os error 2)". Install the runner at the version Cargo.lock pins
      # (must match the `iai-callgrind` lib dep). The `if ! command -v` guard
      # skips the ~1m install when the cache already restored the binary.
      - name: Install iai-callgrind-runner
        run: |
          if command -v iai-callgrind-runner >/dev/null 2>&1; then
            echo "::notice::iai-callgrind-runner already on PATH; skipping install"
            exit 0
          fi
          ver=$(grep -A1 '^name = "iai-callgrind-runner"$' Cargo.lock | grep version | sed -E 's/version = "([^"]+)".*/\1/')
          if [ -z "$ver" ]; then
            echo "::error::could not resolve iai-callgrind-runner version from Cargo.lock" >&2
            exit 1
          fi
          echo "::notice::Installing iai-callgrind-runner v$ver"
          cargo install iai-callgrind-runner --version "$ver" --locked

      # Run each iai bench. iai-callgrind's `--output-format=json` emits one
      # BenchmarkSummary object per benchmark line on stdout (NDJSON); we
      # append every bench crate's output into one iai.ndjson so the adapter
      # below sees the whole suite as a single stream.
      - name: Run iai-callgrind benchmarks
        run: |
          mkdir -p bench-output
          : > bench-output/iai.ndjson
          for b in iai_build iai_search iai_spectral; do
            echo "::group::running $b"
            cargo bench --bench "$b" -- --output-format=json >> bench-output/iai.ndjson
            echo "::endgroup::"
          done

      # Convert the NDJSON (one BenchmarkSummary per line) into the JSON
      # array benchmark-action's `customSmallerIsBetter` tool expects:
      # [{"name","unit":"Instructions","value"}] projecting the Ir (instructions
      # retired) `Left`/`Both[0]` metric. The adapter is stdlib-only Python.
      - name: Convert iai NDJSON to benchmark-action array
        run: python3 scripts/iai_to_benchmark_action.py bench-output/iai.ndjson bench-output/iai.json

      # iai-callgrind emits instruction counts (smaller = better), which
      # benchmark-action's `customSmallerIsBetter` tool shape accepts. The
      # action's v1 API does not have a dedicated `iai-callgrind` tool key,
      # so we map the JSON through the custom-smaller path. Instruction
      # counts are deterministic → a tight threshold is safe, and a >20%
      # regression fails the job (and the status check posted below).
      - name: Store + chart iai benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: bench-output/iai.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: iai-dev
          comment-on-alert: true
          fail-on-alert: true
          alert-threshold: "120%"

      - name: Upload iai JSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iai-json
          path: |
            bench-output/iai.ndjson
            bench-output/iai.json

      # Post a pass/fail status check back to the arrowspace-rs commit. Runs on
      # both success and failure so branch protection sees the real outcome.
      - name: Post success status check back to arrowspace-rs
        if: success() && github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BENCHES_STATUS_PAT }}
          script: |
            const sha = context.payload.client_payload.sha;
            if (!sha) {
              core.warning('no client_payload.sha — skipping status check');
              return;
            }
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: 'tuned-org-uk',
              repo: 'arrowspace-rs',
              sha,
              state: 'success',
              context: 'arrowspace-benches / iai-callgrind',
              description: 'iai-callgrind instruction counts within threshold',
              target_url: runUrl,
            });

      - name: Post failure status check back to arrowspace-rs
        if: failure() && github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BENCHES_STATUS_PAT }}
          script: |
            const sha = context.payload.client_payload.sha;
            if (!sha) {
              core.warning('no client_payload.sha — skipping status check');
              return;
            }
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: 'tuned-org-uk',
              repo: 'arrowspace-rs',
              sha,
              state: 'failure',
              context: 'arrowspace-benches / iai-callgrind',
              description: 'iai-callgrind regression detected (>20% on an instruction count)',
              target_url: runUrl,
            });

  # Render the cross-version comparison page once every leg finished:
  # one row per benchmark, one column per arrowspace version, wall-clock
  # ns/iter plus ratio against the latest release. Published at the gh-pages
  # root so https://tuned-org-uk.github.io/arrowspace-benches/ lands here.
  compare:
    needs: criterion
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download leg artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: criterion-json-*
          merge-multiple: false
          path: compare-out

      - name: Build comparison page
        run: |
          python3 scripts/make_compare_page.py \
            --out compare-out/index.html \
            "latest=compare-out/criterion-json-latest/criterion.json" \
            "v0.27.0=compare-out/criterion-json-v0.27.0/criterion.json" \
            "v0.26.14=compare-out/criterion-json-v0.26.14/criterion.json" \
            "v0.26.12=compare-out/criterion-json-v0.26.12/criterion.json"

      - name: Publish comparison page to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          cp compare-out/index.html ./index.html
          git add index.html
          git diff --cached --quiet && echo "page unchanged" && exit 0
          git commit -m "pages: refresh cross-version comparison [skip ci]"
          git push origin gh-pages
