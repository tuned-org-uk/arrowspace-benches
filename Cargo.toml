[package]
name = "arrowspace-benches"
description = "Benches for arrowspace"
homepage = "https://github.com/tuned-org-uk/arrowspace-rs"
version = "0.1.0"
authors = ["Lorenzo <tunedconsulting@gmail.com>"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
documentation = "https://docs.rs/arrowspace"
repository = "https://github.com/tuned-org-uk/arrowspace-benches"
readme = "README.md"
keywords = ["vector-search", "spectral-analysis", "benchmark", "criterion"]
categories = ["science"]

[dependencies]
# CI resolves arrowspace from crates.io (`">=0.26.12"` resolves the latest
# release, currently 0.27.x; the floor admits the `--precise` pin legs
# 0.26.12 / 0.26.14 / 0.27.0 in bench.yml).
#
# For local dev against a sibling arrowspace-rs checkout, temporarily swap
# this line for: arrowspace = { path = "../arrowspace-rs" }
arrowspace = ">=0.26.12"
# Dependency versions mirror arrowspace-rs's Cargo.toml so cargo unifies a
# single version of each across the graph.
rand = "0.10"
rand_chacha = "0.10"

# Bench harness: criterion wall-clock + statistics (local + CI).
[dependencies.criterion]
version = "0.8"
default-features = false

# Deterministic instruction-count gate (Linux/Valgrind only). The separate
# runner binary is not auto-installed by cargo bench — see AGENTS.md.
[target.'cfg(target_os = "linux")'.dev-dependencies]
iai-callgrind = "0.14"

[[bench]]
name = "build"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "spectral"
harness = false

[[bench]]
name = "scale"
harness = false

[[bench]]
name = "cve"
harness = false

[[bench]]
name = "iai_build"
harness = false

[[bench]]
name = "iai_search"
harness = false

[[bench]]
name = "iai_spectral"
harness = false
